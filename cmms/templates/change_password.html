{% extends "base.html" %}
{% block title %}<title>เปลี่ยนรหัสผ่าน</title>{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header">เปลี่ยนรหัสผ่าน</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">เปลี่ยนรหัสผ่าน</button>
      <a href="{% url 'profile' %}" class="btn btn-secondary ms-2">ยกเลิก</a>
    </form>
  </div>
</div>
{% endblock %}
