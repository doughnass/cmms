{% extends 'base.html' %}
{% block title %}<title>Template render - {{ path }}</title>{% endblock %}
{% block content %}
<h3>Render: {{ path }}</h3>
{% if error %}
  <div class="alert alert-danger">Error rendering template: {{ error }}</div>
{% else %}
  <div class="border bg-white p-3">{{ rendered|safe }}</div>
{% endif %}
<p class="mt-3"><a href="{% url 'template_source' %}?path={{ path|urlencode }}">View source</a></p>
{% endblock %}
